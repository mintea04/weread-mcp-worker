name = "weread-mcp-worker"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 保留 workers.dev 作为备用入口（正式入口见下方自定义域名）
workers_dev = true

# 自定义域名（可选）：换成你自己的域名，部署时会自动建 DNS 记录与证书
# routes = [
#   { pattern = "weread.example.com", custom_domain = true }
# ]

# 密钥不写在这里，用 wrangler secret put 存：
#   wrangler secret put WEREAD_API_KEY     # 微信读书 wrk- 开头的 key
#   wrangler secret put MCP_AUTH_TOKEN     # 你自己给手机端约定的访问口令（可自定义一串随机字符）

# ---------------------------------------------------------------------------
# 共读数据 KV：省略 id 时，Wrangler 会在首次部署时自动创建并绑定命名空间。
# 看板导入的原文与双方批注会存放在这里。
# ---------------------------------------------------------------------------
[[kv_namespaces]]
binding = "COREAD_KV"
